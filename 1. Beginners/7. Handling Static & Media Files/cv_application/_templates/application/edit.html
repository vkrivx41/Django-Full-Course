{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block links %}
    <link rel="stylesheet" href="{% static 'css/application/main.css' %}">
{% endblock links %}

{% block content %}
    <div class="submission_content">
        <div class="header">
            <h2>Edit your Application</h2>
        </div>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit">Submit</button>
        </form>
    </div>
{% endblock content %}
