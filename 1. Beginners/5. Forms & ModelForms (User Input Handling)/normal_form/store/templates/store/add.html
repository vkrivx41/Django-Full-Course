{% extends "store/base.html" %}

{% block content %}
    
    <h4>Add Product</h4>

    <form action="" method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="input-field">
                <label for="">{{ field.label }}</label>
                <div class="field">
                    {{ field }}
                </div>
                <div class="error">
                    {{ field.errors}}
                </div>
            </div>
        {% endfor %}

        <button type="submit">Add</button>
    </form>
{% endblock content %}
