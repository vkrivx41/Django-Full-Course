{% extends 'base.html' %}

{% block content %}
    <h1>Document List</h1>
    <ul>
        {% for document in documents %}
            <li>
                <a href="{% url 'document:detail' document.id %}">{{ document }}</a>

                {% if share %}
                    <button>Share</button>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
