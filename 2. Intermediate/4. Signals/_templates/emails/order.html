<!DOCTYPE html>
<html>
   <body style="font-family: Arial;">
      <h2 style="color:#333;">Hello {{ buyer.name }}</h2>

      <h3>Your order <strong>#{{ order.pk }}</strong> buying {{ order.product.name }} was successful.</h>

      <table border="2">
         <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Created At</th>
        </tr>
        <tr>
            <td>{{ order.id }}</td>
            <td>{{ order.product.name }}</td>
            <td>{{ order.quantity }}</td>
            <td>{{ order.cost_price }}</td>
            <td>{{ order.created_at|date:'Y-m-d H:i' }}</td>
           </tr>
      </table>
      <br>
      <br>
      <a href="{{ orders_url }}" 
         style="background:#4CAF50;color:white;padding:10px;text-decoration:none;">
         View Orders
      </a>
   </body>
</html>
