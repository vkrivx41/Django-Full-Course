[project]
name = "7-web-development"
version = "0.1.0"
description = "A package containing all Django 6 Courses from Beginners to Advanced"
authors = [
    {name = "Pasxal Le Grand",email = "vkrivx41@gmail.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "redis (>=7.2.1,<8.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "django (>=6.0.3,<7.0.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "channels[daphne] (>=4.3.2,<5.0.0)",
    "django-debug-toolbar (>=6.2.0,<7.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "boto3 (>=1.42.64,<2.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "django-restframework (>=0.0.1,<0.0.2)",
    "django-rest-framework (>=0.1.0,<0.2.0)",
    "django-silk (>=5.5.0,<6.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
]

[tool.poetry]
packages = [{include = "7"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
